<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Month Compare</title>
  <style>
    :root{
      --border: rgba(0,0,0,.08);
      --shadow: 0 6px 18px rgba(0,0,0,.04);
      --text: #111;
    }
    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      /* ✅ 가로 스크롤은 '패널 내부'에서만 허용 */
      overflow-x:hidden;
    }

    /* ✅ 노션 임베드 폭 기준 container query */
    .wrap{
      max-width:1100px;
      width:100%;
      margin:0 auto;
      padding:14px 14px 18px;

      container-type: inline-size;
      container-name: embed;
    }

    /* ✅ 넓을 때: 패널이 내용폭 기준으로 잡히게 (여백 최소화) */
    .grid{
      display:grid;
      grid-template-columns: max-content max-content; /* 핵심 */
      gap:14px;
      align-items:start;
      justify-content:start;
    }

    .panel{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      box-shadow: var(--shadow);
      padding:14px 14px 12px;
      min-height:260px;

      /* ✅ 차트가 너무 좁은 곳에 들어가면 패널 내부에서 가로 스크롤 허용 */
      overflow-x:auto;
      overflow-y:hidden;

      /* 스크롤바가 생겨도 카드 느낌 유지 */
      max-width:100%;
    }

    .panel h3{
      margin:0 0 10px;
      font-size:14px;
      font-weight:900;
      letter-spacing:-0.2px;
      white-space:nowrap;
    }

    /* ✅ 차트 컨테이너는 내용폭만큼만 */
    .chart{
      display:inline-block;
      width:fit-content;
      max-width:none;
      min-width:0;
    }

    /* ✅ 임베드가 좁아지면 1열로 내려감(짤림 방지) */
    @container embed (max-width: 980px){
      .grid{
        grid-template-columns: 1fr;
      }
      /* 1열에서는 패널 폭을 꽉 쓰되, 차트는 넘치면 패널 내부에서 스크롤 */
      .panel{
        width:100%;
      }
      .chart{
        width:fit-content;
      }
    }

    /* ✅ 임베드가 “터무니없이” 좁아지는 구간: 이때는 가로바가 생기는 게 맞음 */
    @container embed (max-width: 520px){
      .panel{
        padding:12px 12px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="panel">
        <h3>전월 대비 · 업무유형</h3>
        <div id="chartWorkDelta" class="chart"></div>
      </div>

      <div class="panel">
        <h3>전월 대비 · 성과유형</h3>
        <div id="chartOutcomeDelta" class="chart"></div>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
