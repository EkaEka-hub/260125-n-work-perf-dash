<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KPI</title>
  <style>
    :root{
      --callout:#fff7c9;
      --text:#222;
      --muted:#555;
      --sub:#777;
      --danger:#b42318;
      --btn:#111;
      --card:#ffffff;
      --border: rgba(0,0,0,0.08);
    }
    html,body{height:100%;}
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background:#fff; }

    .page{max-width: 1100px; margin: 0 auto; padding: 16px;}
    .top{ display:flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; white-space: nowrap; }
    .top .title{font-size:14px; font-weight:850;}
    .top .date{font-size:12px; color: var(--sub); font-variant-numeric: tabular-nums;}

    .grid{ display:grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(3, minmax(0, 1fr));} }
    @media (max-width: 560px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }

    .card{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); min-height: 74px; }
    .card .label{ font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
    .card .value{ font-size: 22px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .card .sub{ margin-top: 6px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }

    /* Setup UI */
    .setupWrap{ max-width: 520px; margin: 16px auto; background: var(--callout); border-radius: 18px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .setupTitle{ font-size:12px; font-weight:600; color: var(--muted); margin-bottom: 10px; }
    .setupBodyTitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--danger);margin:2px 0 10px;line-height:1.15;}.warnIcon{font-size:16px;line-height:1;transform:translateY(-0.5px);}
    .setupBox{ background: rgba(255,255,255,0.55); border-radius: 14px; padding: 10px; font-size: 12px; color: #222; line-height: 1.35; }
    .setupStep{ margin: 8px 0; }
    .envList{ margin:8px 0 0 0; padding-left:16px; }
    .pill{ display:inline-block; border: 1px solid rgba(0,0,0,0.15); border-radius: 999px; padding: 2px 8px; margin-right: 6px; font-size: 11px; background: rgba(255,255,255,0.7); }
    .btnRow{ display:flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn{ appearance:none; border:none; border-radius: 12px; padding: 8px 10px; font-size: 12px; font-weight: 800; background: var(--btn); color:#fff; cursor:pointer; }
    .btn.secondary{ background: rgba(0,0,0,0.25); color: #111; border: 1px solid rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="page" id="app"></div>

  <script>
    const app = document.getElementById("app");

    function copy(text){ try{ navigator.clipboard.writeText(text); }catch(e){} }

    function renderSetup(need){
      const req = Array.isArray(need) && need.length
        ? need
        : ["NOTION_TOKEN","NOTION_DAILY_DB_ID","NOTION_TODO_DB_ID"];

      const routes = ["/today","/kpi","/this-month","/month-compare"]
        .map(p => `${location.origin}${p}`).join("\n");

      app.innerHTML = `
        <div class="setupWrap">
          <div class="setupTitle">Monthly KPI</div>
          <div class="setupBodyTitle"><span class="warnIcon">⚠️</span><span>설정이 필요해요</span></div>
          <div class="setupBox">
            <div class="setupStep"><b>1)</b> Vercel 프로젝트에서 <b>환경변수</b>를 입력해야 위젯이 작동합니다.</div>
            <div class="setupStep"><b>2)</b> 필수 3개:</div>
            <ul class="envList">
              ${req.map(k=>`<li><span class="pill">${k}</span></li>`).join("")}
            </ul>
            <div class="setupStep" style="margin-top:10px;"><b>3)</b> 배포 후 노션에는 아래 <b>4개 주소</b>를 임베드하세요.</div>
            <div class="btnRow">
              <button class="btn" id="copyRoutes">4개 임베드 주소 복사</button>
              <button class="btn secondary" id="retry">다시 불러오기</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("copyRoutes").onclick = () => copy(routes);
      document.getElementById("retry").onclick = () => location.reload();
    }

    function safeNumber(x){ const n = Number(x); return Number.isFinite(n) ? n : 0; }

    function renderKPI(j){
      const month = j?.kpi?.month || j?.meta?.month || "";
      const totalWork = safeNumber(j?.kpi?.monthlyTotalWork);
      const plannedTotal = safeNumber(j?.kpi?.plannedTotal);
      const plannedDone  = safeNumber(j?.kpi?.plannedDone);
      const plannedPending = safeNumber(j?.kpi?.plannedPending);
      const unplanned = safeNumber(j?.kpi?.unplanned);
      const planRate = (j?.kpi?.planRate ?? null);

      const hold = safeNumber(j?.kpi?.statusCount?.["보류"] ?? j?.kpi?.holdCount);
      const doneText = `${plannedDone}/${plannedTotal}`;
      const rateText = (planRate === null || planRate === undefined) ? "-" : `${Math.round(safeNumber(planRate) * 100)}%`;

      const cards = [
        { label:"이번달 총 업무", value:`${totalWork}건`, sub:`전월: ${safeNumber(j?.kpi?.lastMonthlyTotalWork)}건` },
        { label:"To-do 완료", value:`${doneText}`, sub:(hold>0 ? `보류 포함: ${hold}건` : "") },
        { label:"To-do 미완료", value:`${plannedPending}건`, sub:"" },
        { label:"돌발업무", value:`${unplanned}건`, sub:"(To-do 외)" },
        { label:"To-do 달성률", value: rateText, sub:"" },
        { label:"기준", value: (month || "-"), sub:"월 기준" },
      ];

      app.innerHTML = `
        <div class="top">
          <div class="title">월간 KPI</div>
          <div class="date">${month || ""}</div>
        </div>
        <div class="grid">
          ${cards.map(c => `
            <div class="card">
              <div class="label">${c.label}</div>
              <div class="value">${c.value}</div>
              <div class="sub">${c.sub || "&nbsp;"}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function main(){
      const r = await fetch("/api/monthly?t=" + Date.now(), { cache:"no-store" });
      const j = await r.json().catch(()=> ({}));

      if (!r.ok || j?.error === "Missing env"){
        renderSetup(j?.need);
        return;
      }
      renderKPI(j);
    }

    main();
  </script>
</body>
</html>
