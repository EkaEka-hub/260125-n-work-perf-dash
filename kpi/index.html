<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPI</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background:#fff;
      color:#111;
    }

    .wrap{
      width:100%;
      margin:0 auto;
      padding:12px 12px 14px;
      box-sizing:border-box;
    }

    .grid{
      display:grid;
      gap:10px;
      align-items:stretch;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (min-width:700px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width:980px){
      .grid{ grid-template-columns: repeat(6, minmax(0, 1fr)); }

      .card{ padding:10px 10px; }
      .k{ font-size:12px; margin-bottom:4px; }
      .v{ font-size:20px; }
      .hint{ font-size:12px; margin-top:4px; }
      .monthMain{ font-size:20px; }
      .monthSub{ font-size:12px; }
      .delta{ font-size:12px; }
    }

    .card{
      border:1px solid rgba(0,0,0,.08);
      border-radius:14px;
      background:#fff;
      box-shadow:0 6px 18px rgba(0,0,0,.04);
      padding:12px 14px;
      box-sizing:border-box;
      min-width:0;
    }

    .k{
      font-size:13px;
      color:rgba(0,0,0,.6);
      margin-bottom:6px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .v{
      font-size:23px;
      font-weight:900;
      letter-spacing:-0.2px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hint{
      margin-top:6px;
      font-size:13px;
      color:rgba(0,0,0,.5);
      font-weight:500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .delta{
      font-size:13px;
      font-weight:800;
      margin-left:8px;
      vertical-align:middle;
      white-space:nowrap;
    }

    .monthBox{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .monthMain{
      font-size:23px;
      font-weight:900;
      letter-spacing:-0.2px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .monthSub{
      font-size:13px;
      color:rgba(0,0,0,.5);
      font-weight:500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">

      <div class="card">
        <div class="monthBox">
          <div class="monthMain" id="kpiMonth">-</div>
          <div class="monthSub" id="kpiTopWork">최다 업무: -</div>
          <div class="monthSub" id="kpiTopOutcome">최다 성과: -</div>
        </div>
      </div>

      <div class="card">
        <div class="k">이번달 총 업무</div>
        <div class="v">
          <span id="kpiTotalWork">0</span>건
          <span class="delta" id="kpiDelta"></span>
        </div>
        <div class="hint" id="kpiLastTotal">전월: -</div>
      </div>

      <div class="card">
        <div class="k">To-do 완료</div>
        <div class="v"><span id="kpiPlannedDone">0</span>건</div>
        <div class="hint" id="kpiDoneRule">완료 기준: -</div>
      </div>

      <div class="card">
        <div class="k">To-do 미완료</div>
        <div class="v"><span id="kpiPlannedPending">0</span>건</div>
        <div class="hint" id="kpiPendingRule">기준: -</div>
      </div>

      <div class="card">
        <div class="k">돌발업무</div>
        <div class="v"><span id="kpiUnplanned">0</span>건</div>
      </div>

      <div class="card">
        <div class="k">To-do 달성률</div>
        <div class="v"><span id="kpiPlanRate">0</span>%</div>
        <div class="hint" id="kpiDoneOverTotal">-/-</div>
      </div>

    </div>
  </div>

  <!-- ✅ 여기! app.js 캐시 뚫기용 버전 파라미터 -->
  <script src="/assets/app.js?v=20260121-1"></script>
</body>
</html>
