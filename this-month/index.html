<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>This Month</title>
  <style>
    :root{
      --blue: #5b8def;
      --orange: #ff8a3d;
      --track: rgba(0,0,0,.07);
      --text: #111;
      --muted: rgba(0,0,0,.55);
      --card-border: rgba(0,0,0,.08);
      --shadow: 0 6px 18px rgba(0,0,0,.04);
      --radius: 16px;
      --bar-h: 14px;
      --gap-y: 8px;
      --label-w: 118px;   /* ⬅ 라벨칸 가로폭(작게) */
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background:#fff;
      color:var(--text);
    }

    /* ✅ 이번달 페이지만 가로폭 줄이는 핵심 */
    .wrap{
      max-width: 900px;     /* ⬅ 여기 820~860으로 더 줄여도 됨 */
      margin: 0 auto;
      padding: 10px 10px 12px;
    }

    /* 2개 패널: 넓으면 2열, 좁으면 1열 */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px; /* ⬅ 간격 줄임 */
      align-items: stretch;
    }
    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
    }

    .panel{
      border:1px solid var(--card-border);
      border-radius: var(--radius);
      background:#fff;
      box-shadow: var(--shadow);
      padding: 10px 12px;  /* ⬅ 패딩 줄임 */
      overflow:hidden;
    }

    .panel-title{
      font-size: 14px;      /* ⬅ 약간 작게 */
      font-weight: 900;
      letter-spacing: -0.2px;
      margin: 0 0 8px;
    }

    .rows{
      display:flex;
      flex-direction:column;
      gap: var(--gap-y);
    }

    .row{
      display:grid;
      grid-template-columns: var(--label-w) 1fr;
      align-items:center;
      column-gap: 10px;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track{
      position: relative;
      height: var(--bar-h);
      background: var(--track);
      border-radius: 999px;
      overflow:hidden;
    }

    .fill{
      position:absolute;
      left:0; top:0; bottom:0;
      width:0%;
      border-radius: 999px;
      display:flex;
      align-items:center;
      padding-left: 8px;
      box-sizing: border-box;
      min-width: 0;
    }

    /* ✅ 값 레이블: 흰색 + 막대 시작점 */
    .val-in{
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(0,0,0,.18);
      white-space: nowrap;
    }

    /* 값이 0이면 막대 안에 못 넣으니까 트랙 왼쪽에 회색으로 표시 */
    .val-zero{
      position:absolute;
      left:8px; top:50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 900;
      color: rgba(0,0,0,.45);
      line-height: 1;
      white-space: nowrap;
    }

    /* 로딩/에러 */
    .hint{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <section class="panel">
        <h2 class="panel-title">업무유형</h2>
        <div class="rows" id="workRows"></div>
        <div class="hint" id="workHint"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">성과유형</h2>
        <div class="rows" id="outRows"></div>
        <div class="hint" id="outHint"></div>
      </section>
    </div>
  </div>

  <script>
    (async function(){
      const $ = (id) => document.getElementById(id);

      function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

      function makeRow(label, value, max, color){
        const row = document.createElement("div");
        row.className = "row";

        const l = document.createElement("div");
        l.className = "label";
        l.textContent = label;

        const track = document.createElement("div");
        track.className = "track";

        if(value > 0){
          const pct = max > 0 ? (value / max) * 100 : 0;
          const fill = document.createElement("div");
          fill.className = "fill";
          fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
          fill.style.background = color;

          const v = document.createElement("span");
          v.className = "val-in";
          v.textContent = String(value);

          fill.appendChild(v);
          track.appendChild(fill);
        }else{
          const vz = document.createElement("span");
          vz.className = "val-zero";
          vz.textContent = "0";
          track.appendChild(vz);
        }

        row.appendChild(l);
        row.appendChild(track);
        return row;
      }

      function render(containerId, hintId, labels, values, color){
        const box = $(containerId);
        const hint = $(hintId);
        clear(box);

        if(!Array.isArray(labels) || !Array.isArray(values) || labels.length === 0){
          hint.textContent = "데이터 없음";
          return;
        }

        const max = Math.max(1, ...values.map(v => Number(v) || 0));
        labels.forEach((lab, i) => {
          const v = Number(values[i] || 0);
          box.appendChild(makeRow(lab, v, max, color));
        });

        hint.textContent = "";
      }

      try{
        const res = await fetch("/api/monthly", { cache: "no-store" });
        const data = await res.json();

        if(data?.error){
          $("workHint").textContent = data.error;
          $("outHint").textContent = data.error;
          return;
        }

        // ✅ 이번달(this)만 사용
        render("workRows", "workHint", data?.work?.labels || [], data?.work?.this || [], getComputedStyle(document.documentElement).getPropertyValue("--blue").trim() || "#5b8def");
        render("outRows",  "outHint",  data?.outcome?.labels || [], data?.outcome?.this || [], getComputedStyle(document.documentElement).getPropertyValue("--orange").trim() || "#ff8a3d");

      }catch(e){
        $("workHint").textContent = String(e?.message || e);
        $("outHint").textContent  = String(e?.message || e);
      }
    })();
  </script>
</body>
</html>
